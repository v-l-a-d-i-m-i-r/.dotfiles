# https://github.com/caarlos0/dotfiles.fish/blob/master/tmux/tmux.conf.symlink
# https://github.com/ThePrimeagen/.dotfiles/blob/master/tmux/.tmux.conf
# https://devhints.io/tmux
# https://stackoverflow.com/questions/60309665/neovim-losing-colorscheme-when-in-tmux-all-past-solutions-i-see-dont-work-for
# https://cyfyifanchen.com/neovim-true-color/

# start colors
set -g @status_style_bg "#3B4252"
set -g @status_left_bg "#BF616A"
set -g @status_left_fg "#2E3440"
set -g @status_right_bg "#BF616A"
set -g @status_right_fg "#2E3440"
set -g @window_status_current_fg "#A3BE8C"
set -g @window_status_current_zoomed_flag_fg "#BF616A"
set -g @window_status_style_fg "#acafb4"
set -g @mode_style_bg "#434C5E"
set -g @active_window_title_bg "#2E3440"

set -g @active_window_status_title_bg '#2E3440'
set -g @active_window_status_title_fg '#c2c8d2'
set -g @active_window_status_last_flag_fg '#c2c8d2'
set -g @active_window_status_activity_flag_fg '#c2c8d2'
set -g @active_window_status_bell_flag_fg '#c2c8d2'
set -g @active_window_status_silence_flag_fg '#c2c8d2'
set -g @active_window_status_marked_flag_fg '#c2c8d2'
set -g @active_window_status_zoomed_flag_fg '#BF616A'

set -g @inactive_window_status_title_bg '#3B4252'
set -g @inactive_window_status_title_fg '#acafb4'
set -g @inactive_window_status_last_flag_fg '#acafb4'
set -g @inactive_window_status_activity_flag_fg '#acafb4'
set -g @inactive_window_status_bell_flag_fg '#acafb4'
set -g @inactive_window_status_silence_flag_fg '#acafb4'
set -g @inactive_window_status_marked_flag_fg '#acafb4'
set -g @inactive_window_status_zoomed_flag_fg '#acafb4'
# end colors
set -g @window_status_active_flag_char '' # default is *
set -g @window_status_last_flag_char '' # default is -
set -g @window_status_activity_flag_char '#'
set -g @window_status_bell_flag_char '!'
set -g @window_status_silence_flag_char '~'
set -g @window_status_marked_flag_char 'M'
set -g @window_status_zoomed_flag_char ' ' # default is Z

set -g base-index 1 # Numbering of windows
set -g bell-action any
set -g extended-keys on
set -g extended-keys-format csi-u
set -g monitor-bell on
set -g status-interval 1
set -ga terminal-overrides ',xterm-256color:Tc,*:Ss=\E[%p1%d q:Se=\E[1 q'
set -sg escape-time 1 # quicker responses
set-option -g focus-events on
set-option -g renumber-windows on
set-option -g set-titles on
set-option -g set-titles-string "tmux [#S] #T"
set-option -g status-keys vi
set-option -g status-position top
set-window-option -g mode-keys vi
set-window-option -g pane-base-index 1 # Numbering of Panes

bind r source-file ~/.tmux.conf \; display-message "   Config successfully reloaded!"

# vim-like pane switching
# bind ^ if-shell 'test $(tmux list-panes | wc -l) -gt 1' 'last-pane' 'last-window'
bind ^ last-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-like pane resizing
bind M-h resize-pane -L 5
bind M-j resize-pane -D 5
bind M-k resize-pane -U 5
bind M-l resize-pane -R 5

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind-key -n M-h if-shell "$is_vim" "send-keys M-h"  "resize-pane -L 5"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j"  "resize-pane -D 5"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k"  "resize-pane -U 5"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l"  "resize-pane -R 5"

bind-key -T copy-mode-vi M-h resize-pane -L 5
bind-key -T copy-mode-vi M-j resize-pane -D 5
bind-key -T copy-mode-vi M-k resize-pane -U 5
bind-key -T copy-mode-vi M-l resize-pane -R 5

bind '\' split-window -h -c "#{pane_current_path}"	# vertical split (default prefix-%)
bind - split-window -v -c "#{pane_current_path}"	# horizontal split (default prefix-")
bind | split-window -fh -c "#{pane_current_path}"	# vertical split
bind _ split-window -fv -c "#{pane_current_path}"	# horizontal split

bind-key P paste-buffer
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'yank > #{pane_tty}'
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

## TUXI

# TUXI_LOG_LEVEL="debug"
# TUXI_LOG_FILE="${HOME}/tuxi.log"

set-option -gF @tuxi_active_window_index "0"

set-hook -g session-window-changed \
  'set-option -F @tuxi_active_window_index "#{window_index}"'

set -g @tuxi_config \
  '{
    "active_window_status_activity_flag_fg": "#{@active_window_status_activity_flag_fg}",
    "active_window_status_bell_flag_fg": "#{@active_window_status_bell_flag_fg}",
    "active_window_status_last_flag_fg": "#{@active_window_status_last_flag_fg}",
    "active_window_status_marked_flag_fg": "#{@active_window_status_marked_flag_fg}",
    "active_window_status_silence_flag_fg": "#{@active_window_status_silence_flag_fg}",
    "active_window_status_title_bg": "#{@active_window_status_title_bg}",
    "active_window_status_title_fg": "#{@active_window_status_title_fg}",
    "active_window_status_zoomed_flag_fg": "#{@active_window_status_zoomed_flag_fg}",
    "inactive_window_status_activity_flag_fg": "#{@inactive_window_status_activity_flag_fg}",
    "inactive_window_status_bell_flag_fg": "#{@inactive_window_status_bell_flag_fg}",
    "inactive_window_status_last_flag_fg": "#{@inactive_window_status_last_flag_fg}",
    "inactive_window_status_marked_flag_fg": "#{@inactive_window_status_marked_flag_fg}",
    "inactive_window_status_silence_flag_fg": "#{@inactive_window_status_silence_flag_fg}",
    "inactive_window_status_title_bg": "#{@inactive_window_status_title_bg}",
    "inactive_window_status_title_fg": "#{@inactive_window_status_title_fg}",
    "inactive_window_status_zoomed_flag_fg": "#{@inactive_window_status_zoomed_flag_fg}",
    "min_window_status_width": 21,
    "window_status_active_flag_char": "#{@window_status_active_flag_char}",
    "window_status_activity_flag_char": "#{@window_status_activity_flag_char}",
    "window_status_bell_flag_char": "#{@window_status_bell_flag_char}",
    "window_status_last_flag_char": "#{@window_status_last_flag_char}",
    "window_status_marked_flag_char": "#{@window_status_marked_flag_char}",
    "window_status_separator_char": "▕",
    "window_status_silence_flag_char": "#{@window_status_silence_flag_char}",
    "window_status_zoomed_flag_char": "#{@window_status_zoomed_flag_char}"
  }'

set -g @tuxi_window_state \
  '{
    "active_window_index": #{@tuxi_active_window_index},
    "window_index": #{window_index},
    "window_name": "#{window_name}",
    "window_raw_flags": "#{window_raw_flags}"
  }'

set -g mode-style "bg=#{@mode_style_bg}"
set -g status-left "#[bg=#{@status_left_bg}, fg=#{@status_left_fg}, bold] #S "
set -g status-left-length 85
set -g status-right "#[bg=#{@status_right_bg}, fg=#{@status_right_fg}, bold] #(whoami)@#(uname -n) "
set -g status-right-length 85
set -g status-style "bg=#{@status_style_bg}"
set -g window-status-current-format "#(~/.bin/tuxi window-status-format --config '#{E:@tuxi_config}' --window-state '#{E:@tuxi_window_state}')"
set -g window-status-format "#(~/.bin/tuxi window-status-format --config '#{E:@tuxi_config}' --window-state '#{E:@tuxi_window_state}')"
set -g window-status-separator ''
set -g window-status-style "bg=#{@status_style_bg}, fg=#{@window_status_style_fg}"
